<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- Ground soft shadow -->
  <ellipse cx="60" cy="90" rx="32" ry="7" fill="#070707" opacity="0.48"/>

  <g id="rabbit-standee" stroke="#080706" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    
    <!-- Slender hind leg (Background) -->
    <path d="M46 72l-10 16h12l4-16z" fill="#2d2824"/>

    <!-- Alert body -->
    <path d="M22 66c0-10 10-18 22-20s22 4 28 14l12 6v14H28z" fill="#4f4740"/>
    
    <!-- Fluffy but dirty tail -->
    <circle cx="20" cy="64" r="7" fill="#302a25"/>
    <circle cx="20" cy="64" r="4" fill="#665b52"/>

    <!-- Alert head & Scarred long ears -->
    <path d="M72 54c6 0 12 6 16 12v10c-4 2-10 2-14-2l-6-14c1-3 2-6 4-6z" fill="#4f4740"/>
    
    <!-- Ears -->
    <path d="M68 50l-8-24 6 22z" fill="#302a25"/> <!-- Left Ear -->
    <path d="M76 48l4-28-10 26z" fill="#302a25"/> <!-- Right Ear -->
    <!-- Tear in right ear -->
    <polygon points="76 30, 77 34, 75 33" fill="#080706" stroke="none"/>

    <!-- Small Glinting Red Eye (Mutated wild animal look) -->
    <circle cx="80" cy="60" r="2" fill="#ff4444"/>

    <!-- Left Front Leg (Foreground) -->
    <path d="M42 74l-6 16h10l2-16z" fill="#665b52"/>
    
    <!-- Right Front Leg (Foreground) -->
    <path d="M66 74l4 16h10l-6-16z" fill="#665b52"/>

  </g>
</svg>
