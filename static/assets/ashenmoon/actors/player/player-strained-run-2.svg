<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <!-- Airborne shadow -->
    <ellipse cx="80" cy="207" rx="35" ry="6" fill="#080706" opacity="0.35"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head bobbed up, leaning forward (shifted +14px), desaturated skin #7f6040 -->
    <path d="M94 20c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#7f6040" stroke-width="7"/>
    <path d="M78 42c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M81 52c7 8 20 9 28 1" fill="none" stroke="#2e2218" stroke-width="3" opacity="0.7"/>
    <path d="M86 45h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders -->
    <path d="M86 66v12h16V66" fill="#7f6040" stroke-width="5"/>
    <path d="M63 86c9-12 21-18 31-18s23 6 32 18" fill="#233025" stroke-width="8"/>

    <!-- Torso (desaturated) -->
    <path d="M72 85c7-8 37-8 44 0l-6 55c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <path d="M79 89c6-5 25-5 31 0l-15 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <path d="M94 83l-14 57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M74 119c13 5 30 6 44 0" fill="none" stroke="#7f6040" stroke-width="6"/>
    <path d="M77 117c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.25"/>

    <!-- Left arm low-pumping -->
    <path d="M68 91c-10 10-12 24-10 40" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M58 131c-3 6-7 11-12 12" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Right arm low-pumping -->
    <path d="M120 91c4 10 4 20 2 34" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M122 125c2-2 3-7 3-12" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Belt and holster (subdued) -->
    <path d="M55 140c15 5 34 6 50 0" fill="none" stroke="#1c1a16" stroke-width="6"/>
    <path d="M101 142l15 13" fill="none" stroke="#1c1a16" stroke-width="5"/>

    <!-- Hips and legs (Airborne but strained, legs closer than normal run) -->
    <path d="M59 146c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 149l-16 26" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 149l16 26" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Angled feet in air -->
    <path d="M46 175l14 -3" stroke="#080706" stroke-width="8"/>
    <path d="M104 175l14 3" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M79 94c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.3"/>
    <path d="M110 94c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.2"/>
  </g>
</svg>
