<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <!-- Strained run 2: mid-stride version — still steep lean, heavy arms, legs under body -->
  <ellipse cx="80" cy="207" rx="30" ry="7" fill="#080706" opacity="0.50"/>
  <g stroke="#080706" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8 80 115)">
    <!-- Head -->
    <path d="M80 25c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <!-- Hair -->
    <path d="M64 47c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <!-- Eyes -->
    <path d="M72 50h3m14 0h3" stroke-width="4"/>
    <!-- Neck -->
    <path d="M72 71v12h16V71" fill="#8a6a45" stroke-width="5"/>
    <!-- Shoulder arch -->
    <path d="M49 91c9-12 21-18 31-18s23 6 32 18" fill="#233025" stroke-width="8"/>
    <!-- Torso — darker -->
    <path d="M58 90c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <!-- Vest -->
    <path d="M65 94c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <!-- Center seam -->
    <path d="M80 88v57" fill="none" stroke-width="4"/>
    <!-- Chest strap -->
    <path d="M60 122c13 5 30 6 44 0" fill="none" stroke="#7f6040" stroke-width="5"/>
    <!-- Left arm mid-pump — heavy low position -->
    <path d="M54 96c-8 10-10 20-8 34" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M46 130c-2 0-4-5-4-10" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Right arm mid-pump — heavy low position -->
    <path d="M106 96c8 10 10 20 8 34" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M114 130c2 0 4-5 4-10" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Belt -->
    <path d="M55 145c15 5 34 6 50 0" fill="none" stroke-width="6"/>
    <!-- Hips -->
    <path d="M59 151c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <!-- Both legs moderate spread (mid-stride of strained run) -->
    <path d="M66 154l-14 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 154l14 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Feet -->
    <path d="M43 196h24" stroke-width="8"/>
    <path d="M99 196h24" stroke-width="8"/>
  </g>
</svg>
