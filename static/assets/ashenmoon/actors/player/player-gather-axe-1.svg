<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <ellipse cx="80" cy="207" rx="27" ry="7" fill="#080706" opacity="0.55"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head leaning back slightly (axe raise) -->
    <path d="M78 25c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <path d="M62 47c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M65 57c7 8 20 9 28 1" fill="none" stroke="#34251a" stroke-width="3" opacity="0.7"/>
    <path d="M70 50h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders -->
    <path d="M70 71v12h16V71" fill="#8a6a45" stroke-width="5"/>
    <path d="M47 91c9-12 21-18 31-18s23 6 32 18" fill="#263326" stroke-width="8"/>

    <!-- Torso jacket and vest -->
    <path d="M56 90c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#34251a" stroke-width="7"/>
    <path d="M63 94c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#263326" stroke-width="4"/>
    <path d="M78 88v57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M58 122c13 5 30 6 44 0" fill="none" stroke="#8a6a45" stroke-width="6"/>
    <path d="M61 120c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.45"/>

    <!-- Right arm raised high holding axe handle -->
    <path d="M104 96c6-4 12-6 14-2" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M118 94c4-4 6-8 5-14" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Axe handle and head visible above shoulder/head -->
    <path d="M123 80l-2-42" fill="none" stroke="#5c3d20" stroke-width="6"/>
    <!-- Axe Head -->
    <path d="M110 36h24m-8 0l-4-18 4 18-6 8" fill="none" stroke="#8c8c8c" stroke-width="7"/>

    <!-- Left arm steadying axe low grip -->
    <path d="M52 96c6-2 12-2 16 4" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M68 100c4 4 6 10 5 18" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Belt and holster stub -->
    <path d="M55 145c15 6 34 7 50 0" fill="none" stroke="#080706" stroke-width="6"/>
    <path d="M101 147l15 13" fill="none" stroke="#34322d" stroke-width="5"/>
    <path d="M116 160l8 7" fill="none" stroke="#d9c28e" stroke-width="4"/>

    <!-- Hips and legs (braced stance) -->
    <path d="M59 151c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 154l-6 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 154l14 43" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Flat feet -->
    <path d="M53 199h22" stroke="#080706" stroke-width="8"/>
    <path d="M99 199h26" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M63 99c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.6"/>
    <path d="M94 99c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.5"/>
    <path d="M70 188c7 3 16 3 23 0" fill="none" stroke="#d9c28e" stroke-width="3" opacity="0.35"/>
  </g>
