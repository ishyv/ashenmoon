<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <ellipse cx="80" cy="207" rx="27" ry="7" fill="#080706" opacity="0.55"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head leaning left (shifted -8px) -->
    <path d="M72 27c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <path d="M56 49c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M59 59c7 8 20 9 28 1" fill="none" stroke="#34251a" stroke-width="3" opacity="0.7"/>
    <path d="M64 52h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders leaning left -->
    <path d="M64 73v12h16V73" fill="#8a6a45" stroke-width="5"/>
    <path d="M41 93c9-12 21-18 31-18s23 6 32 18" fill="#263326" stroke-width="8"/>

    <!-- Torso leaning left (away from right wound) -->
    <path d="M50 92c7-8 37-8 44 0l16 53c-8 12-49 12-60 0z" fill="#34251a" stroke-width="7"/>
    <path d="M57 96c6-5 25-5 31 0l7 45c-7 6-30 6-38 0z" fill="#263326" stroke-width="4"/>
    <path d="M72 90l10 57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M52 124c13 5 30 6 44 0" fill="none" stroke="#8a6a45" stroke-width="6"/>
    <path d="M55 122c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.45"/>

    <!-- Left arm extended for balance -->
    <path d="M46 98c-20 10-26 22-24 38" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M22 136c-4 8-9 14-16 14" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Right arm clutching wound on hip -->
    <path d="M98 98c2 10 1 22-2 36" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M96 134c-1 8-3 14-3 18" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Belt and holster stub -->
    <path d="M55 147c15 6 34 7 50 0" fill="none" stroke="#080706" stroke-width="6"/>
    <path d="M101 149l15 13" fill="none" stroke="#34322d" stroke-width="5"/>
    <path d="M116 162l8 7" fill="none" stroke="#d9c28e" stroke-width="4"/>

    <!-- Hips and legs (good left leg steps normally, injured right leg takes short step) -->
    <path d="M59 153c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 156l-16 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 156l2 43" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Flat feet -->
    <path d="M39 199h22" stroke="#080706" stroke-width="8"/>
    <path d="M85 199h22" stroke="#080706" stroke-width="8"/>

    <!-- Blood stain on right thigh -->
    <ellipse cx="98" cy="173" rx="5" ry="8" fill="#3a1010" opacity="0.65"/>

    <!-- Highlights -->
    <path d="M57 101c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.6"/>
    <path d="M88 101c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.5"/>
    <path d="M70 190c7 3 16 3 23 0" fill="none" stroke="#d9c28e" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
