<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <!-- Injured walk 1: body leans AWAY from wound (left), right arm clutches side, left arm out for balance -->
  <!-- Wound side = right; right leg takes short steps to protect it -->
  <ellipse cx="78" cy="208" rx="30" ry="7" fill="#080706" opacity="0.58"/>
  <g stroke="#080706" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-5 78 115)">
    <!-- Head -->
    <path d="M80 25c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <!-- Hair -->
    <path d="M64 47c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <!-- Eyes -->
    <path d="M72 50h3m14 0h3" stroke-width="4"/>
    <!-- Neck -->
    <path d="M72 71v12h16V71" fill="#8a6a45" stroke-width="5"/>
    <!-- Shoulder arch -->
    <path d="M49 91c9-12 21-18 31-18s23 6 32 18" fill="#263326" stroke-width="8"/>
    <!-- Torso -->
    <path d="M58 90c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#34251a" stroke-width="7"/>
    <!-- Vest -->
    <path d="M65 94c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#263326" stroke-width="4"/>
    <!-- Center seam -->
    <path d="M80 88v57" fill="none" stroke-width="4"/>
    <!-- Chest strap -->
    <path d="M60 122c13 5 30 6 44 0" fill="none" stroke="#8a6a45" stroke-width="6"/>
    <!-- Left arm EXTENDED OUT for balance — arm swings wide -->
    <path d="M54 96c-20 10-26 22-24 38" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M30 134c-4 8-9 14-16 14" fill="none" stroke="#8a6a45" stroke-width="8"/>
    <!-- Right arm CLUTCHING WOUND — arm pulled close to body -->
    <path d="M106 96c2 10 1 22-2 36" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M104 132c-1 8-3 14-3 18" fill="none" stroke="#8a6a45" stroke-width="8"/>
    <!-- Belt -->
    <path d="M55 145c15 6 34 7 50 0" fill="none" stroke-width="6"/>
    <!-- Tool stub -->
    <path d="M101 147l15 13" fill="none" stroke="#34322d" stroke-width="5"/>
    <path d="M116 160l8 7" fill="none" stroke="#d9c28e" stroke-width="4"/>
    <!-- Hips -->
    <path d="M59 151c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <!-- Left leg — good leg, NORMAL stride -->
    <path d="M66 154l-14 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Right leg — INJURED, very short step to protect wound -->
    <path d="M94 154l4 44" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Left foot (good side, normal stride) -->
    <path d="M43 198h26" stroke-width="8"/>
    <!-- Right foot (injured side, barely moves) -->
    <path d="M89 199h22" stroke-width="8"/>
    <!-- Injury mark on right thigh — dark blood smear -->
    <ellipse cx="100" cy="173" rx="5" ry="8" fill="#3a1010" opacity="0.65"/>
    <!-- Highlights -->
    <path d="M65 99c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.6"/>
    <path d="M96 99c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
