    <path d="M73 64c7 8 20 9 28 1" fill="none" stroke="#2e2218" stroke-width="3" opacity="0.7"/>
    <path d="M78 57h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders hunched down -->
    <path d="M78 78v12h16V78" fill="#7f6040" stroke-width="5"/>
    <path d="M55 98c9-12 21-18 31-18s23 6 32 18" fill="#233025" stroke-width="8"/>

    <!-- Torso (darker, desaturated jacket #2e2218, vest #233025) -->
    <path d="M64 97c7-8 37-8 44 0l-6 53c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <path d="M71 101c6-5 25-5 31 0l-15 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <path d="M86 95l-10 57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M66 129c13 4 30 5 44 0" fill="none" stroke="#7f6040" stroke-width="5"/>
    <path d="M69 127c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.25"/>

    <!-- Left arm dangling low (limp hang) -->
    <path d="M60 103c-8 15-7 35-5 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M55 155c0 9-1 17-3 23" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Right arm dangling low (limp hang) -->
    <path d="M112 103c5 15 4 35 2 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M114 155c0 9 1 17 3 23" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Belt and tool/holster stub (subdued) -->
    <path d="M55 150c15 5 34 6 50 0" fill="none" stroke="#1c1a16" stroke-width="6"/>
    <path d="M101 152l15 13" fill="none" stroke="#1c1a16" stroke-width="5"/>

    <!-- Hips and legs (very short 45px stride shuffle) -->
    <path d="M59 156c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 159l-8 40" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 159l8 40" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Flat feet close together -->
    <path d="M47 199h22" stroke="#080706" stroke-width="8"/>
    <path d="M91 199h22" stroke="#080706" stroke-width="8"/>

    <!-- Highlights (subdued opacity) -->
    <path d="M71 106c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.3"/>
    <path d="M102 106c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.2"/>
