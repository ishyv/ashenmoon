<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <!-- Exhausted: desaturated skin, darker jacket, forward hunch, short shuffle steps, dangling arms -->
  <ellipse cx="79" cy="210" rx="32" ry="7" fill="#080706" opacity="0.62"/>
  <g stroke="#080706" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 5) rotate(-5 80 105)">
    <!-- Head — slightly drooped (same shape, inherited lean from transform) -->
    <path d="M80 25c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#7f6040" stroke-width="7"/>
    <!-- Hair -->
    <path d="M64 47c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <!-- Eyes -->
    <path d="M72 50h3m14 0h3" stroke-width="4"/>
    <!-- Neck -->
    <path d="M72 71v12h16V71" fill="#7f6040" stroke-width="5"/>
    <!-- Shoulder arch — slightly drooped -->
    <path d="M50 92c8-11 20-17 30-17s22 6 30 17" fill="#233025" stroke-width="8"/>
    <!-- Torso — darker, desaturated jacket -->
    <path d="M58 90c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <!-- Vest — darker -->
    <path d="M65 94c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <!-- Center seam -->
    <path d="M80 88v57" fill="none" stroke-width="4"/>
    <!-- Chest strap — subdued -->
    <path d="M60 122c13 4 30 5 44 0" fill="none" stroke="#7f6040" stroke-width="5"/>
    <!-- Left arm DANGLING — barely swings, straight down low -->
    <path d="M54 96c-5 15-4 35-2 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M52 148c0 9-1 17-3 23" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Right arm DANGLING -->
    <path d="M106 96c5 15 4 35 2 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M108 148c0 9 1 17 3 23" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Belt — darker -->
    <path d="M55 145c15 5 34 6 50 0" fill="none" stroke="#1c1a16" stroke-width="6"/>
    <!-- Hips -->
    <path d="M59 151c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <!-- Left leg — short shuffle, barely extends -->
    <path d="M66 154l-9 42" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Right leg — short shuffle -->
    <path d="M94 154l9 42" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Left foot -->
    <path d="M49 197h22" stroke-width="8"/>
    <!-- Right foot -->
    <path d="M94 197h22" stroke-width="8"/>
  </g>
</svg>
