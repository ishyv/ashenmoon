<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <ellipse cx="80" cy="207" rx="27" ry="7" fill="#080706" opacity="0.62"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head hunched forward and down, desaturated skin #7f6040, hair #1a130f -->
    <path d="M86 32c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#7f6040" stroke-width="7"/>
