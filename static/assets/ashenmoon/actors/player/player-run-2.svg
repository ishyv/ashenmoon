<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <!-- Airborne: wider, softer shadow -->
    <ellipse cx="80" cy="207" rx="38" ry="6" fill="#080706" opacity="0.35"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head bobbed up 5px, leaning forward -->
    <path d="M90 20c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <path d="M74 42c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M77 52c7 8 20 9 28 1" fill="none" stroke="#34251a" stroke-width="3" opacity="0.7"/>
    <path d="M82 45h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders bobbed up -->
    <path d="M82 66v12h16V66" fill="#8a6a45" stroke-width="5"/>
    <path d="M59 86c9-12 21-18 31-18s23 6 32 18" fill="#263326" stroke-width="8"/>

    <!-- Torso outer jacket and vest bobbed up -->
    <path d="M68 85c7-8 37-8 44 0l-2 55c-8 12-49 12-60 0z" fill="#34251a" stroke-width="7"/>
    <path d="M75 89c6-5 25-5 31 0l-11 45c-7 6-30 6-38 0z" fill="#263326" stroke-width="4"/>
    <path d="M90 83l-10 57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M70 117c13 5 30 6 44 0" fill="none" stroke="#8a6a45" stroke-width="6"/>
    <path d="M73 115c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.45"/>

    <!-- Arms in mid-air pump -->
    <path d="M64 91c-14 11-17 28-14 47" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M50 138c-5 6-10 12-15 15" fill="none" stroke="#8a6a45" stroke-width="8"/>
    <path d="M116 91c5 11 6 27 5 45" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M121 136c4 7 8 13 14 15" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Belt and tool/holster stub -->
    <path d="M55 140c15 6 34 7 50 0" fill="none" stroke="#080706" stroke-width="6"/>
    <path d="M101 142l15 13" fill="none" stroke="#34322d" stroke-width="5"/>
    <path d="M116 155l8 7" fill="none" stroke="#d9c28e" stroke-width="4"/>

    <!-- Hips and legs (Airborne scissored stance) -->
    <path d="M59 146c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 149l-22 26" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 149l22 26" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Angled feet in mid-air -->
    <path d="M38 175l14 -3" stroke="#080706" stroke-width="8"/>
    <path d="M110 175l14 3" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M75 94c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.6"/>
    <path d="M106 94c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.5"/>
    <path d="M70 181c7 3 16 3 23 0" fill="none" stroke="#d9c28e" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
