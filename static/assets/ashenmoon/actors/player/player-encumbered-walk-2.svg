<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <ellipse cx="80" cy="207" rx="31" ry="7" fill="#080706" opacity="0.58"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head bobbed slightly up to Y=27 but still compressed -->
    <path d="M80 27c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <path d="M64 49c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M67 59c7 8 20 9 28 1" fill="none" stroke="#34251a" stroke-width="3" opacity="0.7"/>
    <path d="M72 52h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders compressed/wide -->
    <path d="M72 73v12h16V73" fill="#8a6a45" stroke-width="5"/>
    <path d="M47 93c10-11 22-17 33-17s23 6 33 17" fill="#263326" stroke-width="8"/>

    <!-- Torso outer jacket and vest -->
    <path d="M58 92c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#34251a" stroke-width="7"/>
    <path d="M65 96c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#263326" stroke-width="4"/>
    <path d="M80 90v57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M60 124c13 5 30 6 44 0" fill="none" stroke="#8a6a45" stroke-width="6"/>
    <path d="M63 122c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.45"/>

    <!-- Left arm held wide bracing load -->
    <path d="M54 98c-16 8-18 18-16 34" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M38 132c-2 8-2 16 2 22" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Right arm held wide bracing load -->
    <path d="M106 98c16 8 18 18 16 34" fill="none" stroke="#34251a" stroke-width="13"/>
    <path d="M122 132c2 8 2 16-2 22" fill="none" stroke="#8a6a45" stroke-width="8"/>

    <!-- Belt and tool/holster stub -->
    <path d="M55 147c15 6 34 7 50 0" fill="none" stroke="#080706" stroke-width="6"/>
    <path d="M101 149l15 13" fill="none" stroke="#34322d" stroke-width="5"/>
    <path d="M116 162l8 7" fill="none" stroke="#d9c28e" stroke-width="4"/>

    <!-- Hips and legs (passing phase, weight on left, right crossing) -->
    <path d="M59 153c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <path d="M66 156l0 43" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 156q-6 20-10 38" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Left foot flat standing, right foot slightly raised/crossing -->
    <path d="M55 199h22" stroke="#080706" stroke-width="8"/>
    <path d="M76 192l14 -2" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M65 101c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.6"/>
    <path d="M96 101c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.5"/>
    <path d="M70 190c7 3 16 3 23 0" fill="none" stroke="#d9c28e" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
