    <path d="M66 157l0 40" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 157q-6 16-10 33" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Left foot flat, right foot slightly raised/crossing -->
    <path d="M55 197h22" stroke="#080706" stroke-width="8"/>
    <path d="M76 190l14 -2" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M71 104c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.3"/>
    <path d="M102 104c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.2"/>
  </g>
