<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <g id="grounded-shadow">
    <ellipse cx="80" cy="207" rx="27" ry="7" fill="#080706" opacity="0.60"/>
  </g>

  <g id="human-survivor" stroke="#080706" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head hunched forward, desaturated skin #7f6040 -->
    <path d="M86 30c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#7f6040" stroke-width="7"/>
    <path d="M70 52c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <path d="M73 62c7 8 20 9 28 1" fill="none" stroke="#2e2218" stroke-width="3" opacity="0.7"/>
    <path d="M78 55h3m14 0h3" fill="none" stroke="#080706" stroke-width="4"/>

    <!-- Neck and shoulders hunched down -->
    <path d="M78 76v12h16V76" fill="#7f6040" stroke-width="5"/>
    <path d="M55 96c9-12 21-18 31-18s23 6 32 18" fill="#233025" stroke-width="8"/>

    <!-- Torso -->
    <path d="M64 95c7-8 37-8 44 0l-6 53c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <path d="M71 99c6-5 25-5 31 0l-15 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <path d="M86 93l-10 57" fill="none" stroke="#080706" stroke-width="4" opacity="0.9"/>
    <path d="M66 127c13 4 30 5 44 0" fill="none" stroke="#7f6040" stroke-width="5"/>
    <path d="M69 125c11 4 25 5 38 1" fill="none" stroke="#d9c28e" stroke-width="2" opacity="0.25"/>

    <!-- Left arm dangling -->
    <path d="M60 101c-8 15-7 35-5 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M55 153c0 9-1 17-3 23" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Right arm dangling -->
    <path d="M112 101c5 15 4 35 2 52" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M114 153c0 9 1 17 3 23" fill="none" stroke="#7f6040" stroke-width="8"/>

    <!-- Belt and holster (subdued) -->
    <path d="M55 148c15 5 34 6 50 0" fill="none" stroke="#1c1a16" stroke-width="6"/>
    <path d="M101 150l15 13" fill="none" stroke="#1c1a16" stroke-width="5"/>

    <!-- Hips and legs (passing phase, weight on left, right crossing) -->
