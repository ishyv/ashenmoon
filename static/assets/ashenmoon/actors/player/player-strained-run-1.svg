    <path d="M66 156q12 4 22 19" fill="none" stroke="#16110d" stroke-width="14"/>
    <path d="M94 156l-29 43" fill="none" stroke="#16110d" stroke-width="14"/>
    
    <!-- Feet (Left in air, right toe touching ground) -->
    <path d="M80 175l16 -4" stroke="#080706" stroke-width="8"/>
    <path d="M55 199l20 -5" stroke="#080706" stroke-width="8"/>

    <!-- Highlights -->
    <path d="M79 101c-3 14-3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.3"/>
    <path d="M110 101c3 14 3 29 0 43" fill="none" stroke="#7b8156" stroke-width="3" opacity="0.2"/>
