<svg xmlns="http://www.w3.org/2000/svg" width="160" height="220" viewBox="0 0 160 220">
  <!-- Strained run 1: desperate run — steeper lean than normal run, arms pump LOWER (heavy/tired), darker jacket -->
  <!-- Clearly heavier than normal run but faster stride than walk -->
  <ellipse cx="74" cy="207" rx="36" ry="7" fill="#080706" opacity="0.48"/>
  <g stroke="#080706" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-11 80 115)">
    <!-- Head -->
    <path d="M80 25c-12 0-21 10-21 23 0 15 9 25 21 25s21-10 21-25c0-13-9-23-21-23z" fill="#8a6a45" stroke-width="7"/>
    <!-- Hair -->
    <path d="M64 47c5-11 21-18 34-4 1-15-8-26-21-26-12 0-23 10-23 24 0 5 1 10 4 14 1-3 3-6 6-8z" fill="#1a130f" stroke-width="5"/>
    <!-- Eyes -->
    <path d="M72 50h3m14 0h3" stroke-width="4"/>
    <!-- Neck -->
    <path d="M72 71v12h16V71" fill="#8a6a45" stroke-width="5"/>
    <!-- Shoulder arch -->
    <path d="M49 91c9-12 21-18 31-18s23 6 32 18" fill="#233025" stroke-width="8"/>
    <!-- Torso — strained/darker jacket -->
    <path d="M58 90c7-8 37-8 44 0l8 55c-8 12-49 12-60 0z" fill="#2e2218" stroke-width="7"/>
    <!-- Vest — darker -->
    <path d="M65 94c6-5 25-5 31 0l3 45c-7 6-30 6-38 0z" fill="#233025" stroke-width="4"/>
    <!-- Center seam -->
    <path d="M80 88v57" fill="none" stroke-width="4"/>
    <!-- Chest strap -->
    <path d="M60 122c13 5 30 6 44 0" fill="none" stroke="#7f6040" stroke-width="5"/>
    <!-- Left arm pumping BACK — low pump, heavy -->
    <path d="M54 96c-12 10-16 20-14 34" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M40 130c-3 7-7 11-12 12" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Right arm pumping FORWARD — low pump, not raised high -->
    <path d="M106 96c4 10 4 20 2 34" fill="none" stroke="#2e2218" stroke-width="13"/>
    <path d="M108 130c2-2 3-7 3-12" fill="none" stroke="#7f6040" stroke-width="8"/>
    <!-- Belt -->
    <path d="M55 145c15 5 34 6 50 0" fill="none" stroke-width="6"/>
    <!-- Hips -->
    <path d="M59 151c10 7 31 8 42 0" fill="#1b1712" stroke-width="6"/>
    <!-- Left leg leading — wide but not as extreme as fresh run -->
    <path d="M66 154l-22 42" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Right leg back — wide push -->
    <path d="M94 154l22 41" fill="none" stroke="#16110d" stroke-width="14"/>
    <!-- Left foot -->
    <path d="M32 193h24" stroke-width="8"/>
    <!-- Right foot -->
    <path d="M107 191h24" stroke-width="8"/>
  </g>
</svg>
