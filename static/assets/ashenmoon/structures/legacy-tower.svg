<svg xmlns="http://www.w3.org/2000/svg" width="128" height="192" viewBox="0 0 128 192">
  <!-- Ground Shadow -->
  <ellipse cx="64" cy="184" rx="48" ry="8" fill="#080706" opacity="0.45"/>
  
  <g stroke="#080706" stroke-linejoin="round" stroke-linecap="round">
    <!-- Stone footings at the base -->
    <rect x="16" y="168" width="20" height="16" rx="2" fill="#4a4c4e" stroke-width="4"/>
    <rect x="92" y="168" width="20" height="16" rx="2" fill="#4a4c4e" stroke-width="4"/>

    <!-- Left & Right main wooden beams -->
    <line x1="26" y1="168" x2="38" y2="72" stroke="#3a2517" stroke-width="8"/>
    <line x1="102" y1="168" x2="90" y2="72" stroke="#3a2517" stroke-width="8"/>

    <!-- Support Cross Struts (X-bracing) -->
    <line x1="28" y1="160" x2="100" y2="120" stroke="#583d28" stroke-width="5"/>
    <line x1="100" y1="160" x2="28" y2="120" stroke="#583d28" stroke-width="5"/>
    <line x1="32" y1="115" x2="96" y2="76" stroke="#583d28" stroke-width="5"/>
    <line x1="96" y1="115" x2="32" y2="76" stroke="#583d28" stroke-width="5"/>

    <!-- Center Ladder -->
    <line x1="56" y1="172" x2="56" y2="72" stroke="#1d120a" stroke-width="3"/>
    <line x1="72" y1="172" x2="72" y2="72" stroke="#1d120a" stroke-width="3"/>
    <line x1="56" y1="156" x2="72" y2="156" stroke="#1d120a" stroke-width="3.5"/>
    <line x1="56" y1="140" x2="72" y2="140" stroke="#1d120a" stroke-width="3.5"/>
    <line x1="56" y1="124" x2="72" y2="124" stroke="#1d120a" stroke-width="3.5"/>
    <line x1="56" y1="108" x2="72" y2="108" stroke="#1d120a" stroke-width="3.5"/>
    <line x1="56" y1="92" x2="72" y2="92" stroke="#1d120a" stroke-width="3.5"/>
    <line x1="56" y1="76" x2="72" y2="76" stroke="#1d120a" stroke-width="3.5"/>

    <!-- Lookout Platform floor structure -->
    <rect x="24" y="66" width="80" height="10" fill="#3a2517" stroke-width="4"/>

    <!-- Platform railing/posts -->
    <rect x="28" y="44" width="8" height="22" fill="#583d28" stroke-width="3"/>
    <rect x="92" y="44" width="8" height="22" fill="#583d28" stroke-width="3"/>
    <rect x="60" y="44" width="8" height="22" fill="#583d28" stroke-width="3"/>
    <line x1="28" y1="48" x2="100" y2="48" stroke="#1d120a" stroke-width="4"/>

    <!-- Upper roof posts -->
    <line x1="32" y1="44" x2="36" y2="12" stroke="#3a2517" stroke-width="5"/>
    <line x1="96" y1="44" x2="92" y2="12" stroke="#3a2517" stroke-width="5"/>

    <!-- Pitch roof canopy -->
    <polygon points="12 18, 64 2, 116 18" fill="#5c3c24" stroke-width="4"/>
    <line x1="8" y1="20" x2="64" y2="0" stroke="#2b1a0e" stroke-width="6"/>
    <line x1="120" y1="20" x2="64" y2="0" stroke="#2b1a0e" stroke-width="6"/>
  </g>
</svg>