<svg xmlns="http://www.w3.org/2000/svg" width="320" height="352" viewBox="0 0 320 352">
  <!-- Soft ground drop shadow -->
  <ellipse cx="160" cy="340" rx="140" ry="12" fill="#080706" opacity="0.55"/>
  
  <!-- Main building group -->
  <g stroke="#080706" stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
    
    <!-- Stone Foundation Slab (Weathered and fractured) -->
    <path d="M16 312 L304 312 L296 344 L24 344 Z" fill="#3c3d40"/>
    <!-- Stone cracks and joints -->
    <line x1="72" y1="312" x2="68" y2="344" stroke="#1d1e20" stroke-width="4"/>
    <line x1="128" y1="312" x2="126" y2="344" stroke="#1d1e20" stroke-width="4"/>
    <line x1="192" y1="312" x2="194" y2="344" stroke="#1d1e20" stroke-width="4"/>
    <line x1="248" y1="312" x2="252" y2="344" stroke="#1d1e20" stroke-width="4"/>
    <!-- Fractures -->
    <path d="M40 320l8 12-4 8" fill="none" stroke="#18191a" stroke-width="3"/>
    <path d="M210 316l-6 16 8 8M280 328l-10-8-4 12" fill="none" stroke="#18191a" stroke-width="3"/>

    <!-- Main Timber Wall log body (Charred, heavy wood) -->
    <rect x="36" y="160" width="248" height="152" fill="#422d1f"/>
    <!-- Horizontal Log lines and texture -->
    <line x1="36" y1="190" x2="284" y2="190" stroke="#150e0a" stroke-width="4"/>
    <line x1="36" y1="220" x2="284" y2="220" stroke="#150e0a" stroke-width="4"/>
    <line x1="36" y1="250" x2="284" y2="250" stroke="#150e0a" stroke-width="4"/>
    <line x1="36" y1="280" x2="284" y2="280" stroke="#150e0a" stroke-width="4"/>
    <!-- Wood splits and knots -->
    <path d="M120 174c-4 0-4 6 0 6s4-6 0-6" fill="none" stroke="#150e0a" stroke-width="3"/>
    <line x1="48" y1="204" x2="68" y2="204" stroke="#150e0a" stroke-width="3"/>
    <line x1="220" y1="236" x2="248" y2="236" stroke="#150e0a" stroke-width="3"/>
    <line x1="56" y1="266" x2="80" y2="266" stroke="#150e0a" stroke-width="3"/>

    <!-- Wooden Corner Uprights (Heavy posts) -->
    <rect x="24" y="152" width="20" height="160" fill="#2a1b12"/>
    <rect x="276" y="152" width="20" height="160" fill="#2a1b12"/>
    <!-- Iron bracket studs on corner posts -->
    <circle cx="34" cy="170" r="3" fill="#1c2022"/>
    <circle cx="34" cy="230" r="3" fill="#1c2022"/>
    <circle cx="34" cy="290" r="3" fill="#1c2022"/>
    <circle cx="286" cy="170" r="3" fill="#1c2022"/>
    <circle cx="286" cy="230" r="3" fill="#1c2022"/>
    <circle cx="286" cy="290" r="3" fill="#1c2022"/>

    <!-- Left Gothic Pointed Window (Amber glowing) -->
    <path d="M68 232 V202 A18 18 0 0 1 104 202 V232 Z" fill="#ff9f2b" stroke-width="4"/>
    <line x1="86" y1="184" x2="86" y2="232" stroke="#150e0a" stroke-width="3"/>
    <line x1="68" y1="210" x2="104" y2="210" stroke="#150e0a" stroke-width="3"/>
    <!-- Window stone casing -->
    <path d="M64 236 V198 A22 22 0 0 1 108 198 V236" fill="none" stroke="#252628" stroke-width="4"/>

    <!-- Right Gothic Pointed Window (Amber glowing) -->
    <path d="M216 232 V202 A18 18 0 0 1 252 202 V232 Z" fill="#ff9f2b" stroke-width="4"/>
    <line x1="234" y1="184" x2="234" y2="232" stroke="#150e0a" stroke-width="3"/>
    <line x1="216" y1="210" x2="252" y2="210" stroke="#150e0a" stroke-width="3"/>
    <!-- Window stone casing -->
    <path d="M212 236 V198 A22 22 0 0 1 256 198 V236" fill="none" stroke="#252628" stroke-width="4"/>

    <!-- Centered Arched Doorway (Gothic arch) -->
    <path d="M124 312 V244 A36 36 0 0 1 196 244 V312 Z" fill="#170f0a"/>
    <!-- Door planks -->
    <line x1="142" y1="220" x2="142" y2="312" stroke="#0a0604" stroke-width="3"/>
    <line x1="160" y1="208" x2="160" y2="312" stroke="#0a0604" stroke-width="4"/>
    <line x1="178" y1="220" x2="178" y2="312" stroke="#0a0604" stroke-width="3"/>
    <!-- Iron banding & Studs -->
    <path d="M124 256 H196 M124 290 H196" fill="none" stroke="#252b2f" stroke-width="5"/>
    <circle cx="134" cy="256" r="2" fill="#525d63"/>
    <circle cx="186" cy="256" r="2" fill="#525d63"/>
    <circle cx="134" cy="290" r="2" fill="#525d63"/>
    <circle cx="186" cy="290" r="2" fill="#525d63"/>
    <!-- Heavy iron pull ring -->
    <circle cx="148" cy="276" r="5" fill="none" stroke="#33383c" stroke-width="3"/>

    <!-- Roof Attic / Gable Triangle -->
    <polygon points="20 152, 160 20, 300 152" fill="#2a1b12"/>
    <!-- Vertical Attic planks -->
    <line x1="90" y1="152" x2="90" y2="85" stroke="#150e0a" stroke-width="3"/>
    <line x1="125" y1="152" x2="125" y2="52" stroke="#150e0a" stroke-width="3"/>
    <line x1="160" y1="152" x2="160" y2="20" stroke="#150e0a" stroke-width="3"/>
    <line x1="195" y1="152" x2="195" y2="52" stroke="#150e0a" stroke-width="3"/>
    <line x1="230" y1="152" x2="230" y2="85" stroke="#150e0a" stroke-width="3"/>

    <!-- Left Roof Eave (Heavy, weathered beam) -->
    <line x1="12" y1="160" x2="160" y2="12" stroke="#4a3120" stroke-width="12"/>
    <!-- Right Roof Eave (Heavy, weathered beam) -->
    <line x1="308" y1="160" x2="160" y2="12" stroke="#4a3120" stroke-width="12"/>
    <!-- Eave metal caps -->
    <polygon points="12 154, 8 166, 18 164" fill="#202224"/>
    <polygon points="308 154, 312 166, 302 164" fill="#202224"/>

    <!-- Rotting Moss Patches (Decayed forest growth) -->
    <path d="M120 70 Q130 55 140 60" fill="none" stroke="#4b573a" stroke-width="10" opacity="0.85"/>
    <path d="M180 80 Q190 70 200 85" fill="none" stroke="#4b573a" stroke-width="8" opacity="0.85"/>
    <path d="M130 110 Q145 95 155 105" fill="none" stroke="#4b573a" stroke-width="12" opacity="0.9"/>
    
    <!-- Hanging Chain (Gothic vibe) -->
    <path d="M26 160 Q20 180 34 200 Q40 210 32 220" fill="none" stroke="#333a3e" stroke-width="4" stroke-dasharray="2,6"/>

  </g>
</svg>