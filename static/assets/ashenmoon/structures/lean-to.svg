<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ground Shadow -->
  <ellipse cx="64" cy="116" rx="48" ry="7" fill="#080706" opacity="0.4"/>
  
  <g stroke="#080706" stroke-linejoin="round" stroke-linecap="round">
    <!-- Dark interior shadow under lean-to -->
    <polygon points="32 112, 32 64, 96 112" fill="#1b120c" stroke-width="3"/>

    <!-- Left vertical frame post -->
    <line x1="28" y1="112" x2="28" y2="48" stroke="#3a2517" stroke-width="7"/>
    <!-- Cross support beam at top -->
    <line x1="28" y1="52" x2="34" y2="52" stroke="#3a2517" stroke-width="6"/>

    <!-- Sloped rafters -->
    <line x1="28" y1="52" x2="104" y2="112" stroke="#3a2517" stroke-width="6"/>
    <line x1="56" y1="52" x2="108" y2="112" stroke="#583d28" stroke-width="4" opacity="0.5"/>

    <!-- Straw/thatch sloped roof coverage -->
    <!-- Base thatch shape -->
    <polygon points="24 50, 106 114, 96 114, 20 54" fill="#465a34" stroke-width="3"/>
    
    <!-- Thatch detail straw lines -->
    <line x1="30" y1="56" x2="42" y2="66" stroke="#8a6a45" stroke-width="3"/>
    <line x1="50" y1="72" x2="62" y2="82" stroke="#8a6a45" stroke-width="3"/>
    <line x1="70" y1="88" x2="82" y2="98" stroke="#8a6a45" stroke-width="3"/>
    
    <line x1="40" y1="62" x2="52" y2="72" stroke="#4e4832" stroke-width="3"/>
    <line x1="60" y1="78" x2="72" y2="88" stroke="#4e4832" stroke-width="3"/>
    <line x1="80" y1="94" x2="92" y2="104" stroke="#4e4832" stroke-width="3"/>

    <!-- Ground log locking the thatch -->
    <line x1="16" y1="112" x2="112" y2="112" stroke="#251a10" stroke-width="5"/>
  </g>
</svg>
