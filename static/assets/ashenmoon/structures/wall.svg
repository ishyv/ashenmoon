<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96">
  <!-- Ground soft shadow -->
  <ellipse cx="64" cy="88" rx="52" ry="7" fill="#080706" opacity="0.45"/>

  <g id="palisade-wall" stroke="#080706" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <!-- Stone wedges at the base (Anchoring logs) -->
    <path d="M22 78l8-10 12 10z M92 78l8-10 12 10z" fill="#3c3d40"/>
    <path d="M54 82l6-8 8 8z" fill="#2d2f30"/>

    <!-- Vertical logs with sharpened tops (Palisade) -->
    <!-- Log 1 (Left) -->
    <path d="M16 84 V36 L24 20 L32 36 V84 Z" fill="#3a2517"/>
    <!-- Log 2 (Center-Left) -->
    <path d="M32 84 V32 L40 14 L48 32 V84 Z" fill="#4a3120"/>
    <!-- Log 3 (Center) -->
    <path d="M48 84 V28 L56 10 L64 28 V84 Z" fill="#3a2517"/>
    <!-- Log 4 (Center-Right) -->
    <path d="M64 84 V32 L72 14 L80 32 V84 Z" fill="#4a3120"/>
    <!-- Log 5 (Right) -->
    <path d="M80 84 V36 L88 20 L96 36 V84 Z" fill="#3a2517"/>
    <!-- Log 6 (Far Right overlay) -->
    <path d="M96 84 V42 L104 26 L112 42 V84 Z" fill="#2a1b12"/>

    <!-- Wood grain details and splits on logs -->
    <line x1="24" y1="40" x2="24" y2="76" stroke="#180e09" stroke-width="2"/>
    <line x1="40" y1="36" x2="40" y2="78" stroke="#180e09" stroke-width="2"/>
    <line x1="56" y1="32" x2="56" y2="78" stroke="#180e09" stroke-width="2"/>
    <line x1="72" y1="36" x2="72" y2="78" stroke="#180e09" stroke-width="2"/>
    <line x1="88" y1="40" x2="88" y2="76" stroke="#180e09" stroke-width="2"/>
    <line x1="104" y1="46" x2="104" y2="76" stroke="#180e09" stroke-width="2"/>
    
    <!-- Cracks/Splits in wood tips -->
    <line x1="40" y1="14" x2="40" y2="24" stroke="#080706" stroke-width="3"/>
    <line x1="72" y1="14" x2="72" y2="24" stroke="#080706" stroke-width="3"/>

    <!-- Horizontal Supporting Planks (Binding the palisade) -->
    <!-- Upper support beam -->
    <rect x="12" y="38" width="104" height="10" fill="#2a1b12"/>
    <!-- Lower support beam -->
    <rect x="12" y="66" width="104" height="10" fill="#2a1b12"/>

    <!-- Rusted iron nails and studs on support planks -->
    <circle cx="20" cy="43" r="2" fill="#525d63"/><circle cx="20" cy="71" r="2" fill="#525d63"/>
    <circle cx="44" cy="43" r="2" fill="#525d63"/><circle cx="44" cy="71" r="2" fill="#525d63"/>
    <circle cx="68" cy="43" r="2" fill="#525d63"/><circle cx="68" cy="71" r="2" fill="#525d63"/>
    <circle cx="92" cy="43" r="2" fill="#525d63"/><circle cx="92" cy="71" r="2" fill="#525d63"/>
    <circle cx="108" cy="43" r="2" fill="#525d63"/><circle cx="108" cy="71" r="2" fill="#525d63"/>

    <!-- Moss growth along support planks -->
    <path d="M28 38c6-2 16-2 20 0" fill="none" stroke="#4b573a" stroke-width="3" opacity="0.8"/>
    <path d="M76 66c8-2 14-2 18 0" fill="none" stroke="#4b573a" stroke-width="3" opacity="0.8"/>

  </g>
</svg>