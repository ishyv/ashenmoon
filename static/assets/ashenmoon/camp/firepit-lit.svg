<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Ground soft shadow -->
  <ellipse cx="64" cy="110" rx="54" ry="12" fill="#090807" opacity="0.62"/>

  <!-- Warm background light glow (Low opacity vector circle) -->
  <circle cx="64" cy="74" r="44" fill="#ff7f1a" opacity="0.12"/>

  <g id="firepit-lit" stroke="#080706" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <!-- Ash Bed (Bottom layer inside stone circle) -->
    <ellipse cx="64" cy="98" rx="36" ry="16" fill="#1b1c1e"/>
    
    <!-- Criss-crossed split logs -->
    <path d="M38 108l52-20" fill="none" stroke="#3d281a" stroke-width="10"/> <!-- Log 1 -->
    <path d="M39 88l50 20" fill="none" stroke="#312015" stroke-width="10"/> <!-- Log 2 -->
    <line x1="42" y1="107" x2="86" y2="90" stroke="#1c120c" stroke-width="2"/>
    <line x1="44" y1="90" x2="84" y2="106" stroke="#1c120c" stroke-width="2"/>

    <!-- Layered Gothic Flames (Rising upwards) -->
    <!-- Outer Red/Crimson Fire (Large) -->
    <path d="M64 16c26 28 20 56 0 76-20-20-26-48 0-76z" fill="#9e311b"/>
    <!-- Middle Orange Fire (Medium) -->
    <path d="M64 34c18 20 14 42 0 54-14-12-18-34 0-54z" fill="#d96818"/>
    <!-- Inner Yellow/Amber Fire (Core) -->
    <path d="M64 50c12 14 10 28 0 36-10-8-12-22 0-36z" fill="#e8bc4a"/>

    <!-- Side flames licking outward -->
    <path d="M42 66c-10 16 0 28 8 28-6-4-10-18-8-28z" fill="#9e311b"/>
    <path d="M86 66c10 16 0 28-8 28 6-4 10-18 8-28z" fill="#9e311b"/>
    <path d="M48 72c-6 10 2 18 8 18-4-2-8-12-8-18z" fill="#d96818"/>
    <path d="M80 72c6 10-2 18-8 18 4-2 8-12 8-18z" fill="#d96818"/>

    <!-- Floating Spark Embers (Little vector dots rising) -->
    <circle cx="48" cy="40" r="3" fill="#e8bc4a" stroke="none"/>
    <circle cx="82" cy="34" r="2.5" fill="#ff7f1a" stroke="none"/>
    <circle cx="60" cy="22" r="2" fill="#e8bc4a" stroke="none"/>
    <circle cx="70" cy="14" r="1.5" fill="#ff4444" stroke="none"/>

    <!-- Border Ring of Rough Cracked Stones -->
    <!-- Stone 1 (Bottom) -->
    <path d="M42 114c6 10 38 10 44 0c2-6-46-6-44 0z" fill="#484a4d"/>
    <!-- Stone 2 (Left) -->
    <path d="M16 98c6-10 12-14 24-8c2 8-18 18-24 8z" fill="#3a3c3e"/>
    <!-- Stone 3 (Right) -->
    <path d="M88 90c12-6 18-2 24 8c-6 10-26 0-24-8z" fill="#3a3c3e"/>
    <!-- Stone 4 (Top Left) -->
    <path d="M32 82c10-6 20-4 24 4c-6 6-18 2-24-4z" fill="#2d2f30"/>
    <!-- Stone 5 (Top Right) -->
    <path d="M72 86c4-8 14-10 24-4c-6 6-18 10-24 4z" fill="#2d2f30"/>

    <!-- Individual stone detail cracks -->
    <path d="M60 118l4-8M24 96l6 2M98 100l-6-2" fill="none" stroke="#1c1d1e" stroke-width="2"/>
    <!-- Moss on stones -->
    <path d="M54 114c4-2 12-2 16 0" fill="none" stroke="#4b573a" stroke-width="4" opacity="0.8"/>
    <path d="M28 86c4 0 6 4 4 6" fill="none" stroke="#4b573a" stroke-width="3" opacity="0.8"/>

  </g>
</svg>
